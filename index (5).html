.pl .e{font-size:2.6rem;display:block;animation:bob 2s ease-in-out infinite}

<section class="view" id="v-home">

<h1>📖 TRILEXIS</h1>

<button class="alt big" onclick="soloStart()" style="margin-top:6px">🧑 Practice alone</button>
<p class="msg" id="hm"></p>
</div>
</section>

<section class="view" id="v-lobby" hidden>

<div class="card"><div class="sub" style="margin:0">Room code (share it with friends!)</div><div class="code" id="rcode"></div>
<div class="row"><button class="alt" onclick="copyCode()">📋 Copy code</button></div></div>
<div class="card"><b>👥 Players <span id="pc"></span>/5</b><div class="slots" id="slots" style="margin-top:10px"></div></div>
<div class="card"><b>⏱️ How many minutes?</b><div class="row" id="mins"></div>
<b>🎯 Word level</b><div class="row" id="lvls"></div>

</section>

<section class="view" id="v-game" hidden>

<div class="track" id="track"></div>
<div class="card stage" id="stage">
<button class="hear" onclick="sayW(1)" title="Hear the word">🔊</button>
<div class="row"><button class="alt" onclick="sayW(.5)">🐢 Slow</button><button class="alt" onclick="doHint()">💡 Hint</button><button class="alt" onclick="skipW()">⏭ Skip</button></div>
<div class="slotsw" id="gslots"></div>
<div class="hint" id="hint"></div>
<div id="kb" style="margin-top:8px"></div>
<div class="row"><button style="flex:2" onclick="submitW()">✅ Check (Enter)</button></div>
</div>
</section>

<section class="view" id="v-res" hidden>
<div class="win" id="winner"></div>
<div class="podium" id="podium"></div>
<div id="ranks"></div>
<div class="row"><button onclick="again()">🔁 Play again</button><button class="alt" onclick="leave()">🏠 Leave</button></div>

</section>

var ROOM=null,NR=null,CODE="",solo=false,JT=Date.now(),MP={},view="home",G=null,lastGid="",mute=false,cfg={min:2,lvl:"mix"},hintCache={};

// ---- sound
var AC=null;function beep(f,d,t,v,e,w){if(mute)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state=="suspended")AC.resume();var n=AC.currentTime+(w||0),o=AC.createOscillator(),g=AC.createGain();o.type=t||"sine";o.frequency.setValueAtTime(f,n);if(e)o.frequency.exponentialRampToValueAtTime(e,n+d*.8);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(v||.1,n+.015);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d+.03)}catch(x){}}
var PENT=[523,587,659,784,880,1047,1175,1319],MU=null,MS=0,MEL=[0,2,4,2,5,4,2,0,4,5,7,5,4,2,4,-1],BAS=[261,261,330,330,392,392,330,330];
function pop(n){beep(420+n*55,.09,"sine",.09,900+n*40)}
function music(on){clearInterval(MU);MU=null;if(!on)return;MS=0;MU=setInterval(function(){if(mute||view!="game")return;var m=MEL[MS%16];if(m>=0)beep(PENT[m],.18,"triangle",.045);if(MS%2==0)beep(BAS[(MS>>1)%8]/2,.16,"sine",.06);if(MS%4==2)beep(2400,.03,"square",.012);MS++},190)}
function sfx(k){if(k=="ok"){var m=1+(Math.min(G?G.st:1,8)-1)*.07;beep(784*m,.13,"triangle",.13);beep(1047*m,.16,"triangle",.13,0,.09);beep(1568*m,.28,"sine",.07,0,.18)}
 else if(k=="bad"){beep(330,.3,"sine",.15,110);beep(220,.22,"triangle",.06,90,.06)}
 else if(k=="tick")beep(1200,.05,"sine",.08,1600);
 else if(k=="cnt"){beep(660,.2,"triangle",.14);beep(1320,.12,"sine",.05,0,.02)}
 else if(k=="go"){[523,659,784,1047].forEach(function(f,i){beep(f,.2,"triangle",.13,0,i*.07)});beep(1568,.5,"sine",.09,0,.3)}
 else if(k=="win"){[523,659,784,1047,784,1047,1319].forEach(function(f,i){beep(f,.22,"triangle",.12,0,i*.12);beep(f*2,.14,"sine",.04,0,i*.12)})}}
function toggleMute(){mute=!mute;$("mute").textContent=$("mute2").textContent=mute?"🔇":"🔊"}
// ---- fx canvas: floating letters + confetti
var cv=$("fx"),cx=cv.getContext("2d"),LET=[],CF=[];
function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();addEventListener("resize",rs);
for(var i=0;i<26;i++)LET.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,c:String.fromCharCode(65+Math.floor(Math.random()*26)),s:20+Math.random()*40,v:.2+Math.random()*.6,r:Math.random()*6,k:COLS[i%5]});
function burst(x,y,n){for(var i=0;i<n;i++)CF.push({x:x,y:y,vx:(Math.random()-.5)*12,vy:-Math.random()*13-3,r:Math.random()*6,vr:(Math.random()-.5)*.4,k:COLS[i%5],z:5+Math.random()*7,l:90+Math.random()*50})}
function rain(){for(var i=0;i<140;i++)setTimeout(function(){burst(Math.random()*innerWidth,-10,1);CF[CF.length-1].vy=Math.random()*3},i*14)}
function loop(){cx.clearRect(0,0,cv.width,cv.height);cx.globalAlpha=.13;LET.forEach(function(l){l.y-=l.v;l.r+=.004;if(l.y<-60){l.y=cv.height+60;l.x=Math.random()*cv.width}cx.save();cx.translate(l.x,l.y);cx.rotate(Math.sin(l.r));cx.fillStyle=l.k;cx.font="900 "+l.s+"px system-ui";cx.fillText(l.c,0,0);cx.restore()});
 cx.globalAlpha=1;CF=CF.filter(function(p){return p.l>0&&p.y<cv.height+30});CF.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.vx*=.99;p.r+=p.vr;p.l--;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.k;cx.fillRect(-p.z/2,-p.z/4,p.z,p.z/2);cx.restore()});requestAnimationFrame(loop)}loop();
// ---- home
function drawAvs(){$("avs").innerHTML=AVS.map(function(a,i){return"<button class='av"+(i==avi?" on":"")+"' onclick='avi="+i+";drawAvs()'>"+a+"</button>"}).join("")}drawAvs();
try{$("nm").value=localStorage.getItem("trl_nm")||""}catch(e){}

function setP(p){Object.assign(MP,p);if(NR)NR.presence(p).catch(function(){})}
function plist(){if(!NR)return[{peer:"me",isMe:true,presence:MP}];return NR.peers().filter(function(p){return p.kind=="viewer"&&p.presence&&p.presence.n}).sort(function(a,b){return(a.presence.t-b.presence.t)||(a.peer<b.peer?-1:1)})}
function mineIdx(L){for(var i=0;i<L.length;i++)if(L[i].isMe&&L[i].sameTab)return i;return -1}
var UID="u"+Math.random().toString(36).slice(2,10),DB=null,OFF=0;
(function(){try{var C=window.FIREBASE_CONFIG;if(typeof firebase=="undefined"||!C||String(C.apiKey).indexOf("PASTE")==0){$("hm").textContent="ℹ️ Online rooms need setup (see README). Practice alone works.";return}firebase.initializeApp(C);DB=firebase.database();DB.ref(".info/serverTimeOffset").on("value",function(x){OFF=x.val()||0})}catch(e){$("hm").textContent="Online setup error. Practice alone still works."}})();
function fbRoom(code){var ref=DB.ref("rooms/"+code+"/p"),me=ref.child(UID),peers=[],subs=[];
 ref.on("value",function(x){var v=x.val()||{};peers=Object.keys(v).map(function(id){return{peer:id,isMe:id==UID,sameTab:id==UID,kind:"viewer",guest:false,presence:v[id]||{},updatedAt:0}});subs.forEach(function(f){f({peers:peers,joined:[],left:[],updated:[]})})});
 me.onDisconnect().remove();
 return{presence:function(p){var u={};for(var k in p)u[k]=p[k]===undefined?null:p[k];return me.update(u)},peers:function(){return peers},onPeers:function(f){subs.push(f);return function(){}},leave:async function(){ref.off();try{await me.remove()}catch(e){}}}}

async function enter(code,mk){var n=myName();if(!n)return;if(!DB){$("hm").textContent="Online rooms need setup (see README). Try Practice alone.";return}
 $("hm").textContent="Connecting…";
 try{if(!mk){var x=await DB.ref("rooms/"+code+"/p").once("value");if(!x.exists()){$("hm").textContent="Room not found. Check the code.";return}}NR=fbRoom(code)}catch(e){NR=null;$("hm").textContent="Couldn’t connect. Check your internet.";return}
 CODE=code;solo=false;MP={};JT=Date.now();NR.onPeers(render);
 setP({n:n,av:AVS[avi],t:firebase.database.ServerValue.TIMESTAMP,sc:0,ls:0,st:0,bs:0,d:0});$("rcode").textContent=CODE;$("hm").textContent="";show("lobby");render()}
function createRoom(){var A="ABCDEFGHJKMNPQRSTUVWXYZ23456789",c="";for(var i=0;i<4;i++)c+=A[Math.floor(Math.random()*A.length)];enter(c,true)}
function joinRoom(){var c=$("jc").value.trim().toUpperCase().replace(/[^A-Z0-9]/g,"");if(c.length!=4){$("hm").textContent="Type the 4-letter code from your friend.";return}enter(c,false)}
function soloStart(){var n=myName();if(!n)return;NR=null;solo=true;MP={n:n,av:AVS[avi],t:JT,sc:0,ls:0,st:0,bs:0,d:0};CODE="";show("lobby");$("rcode").textContent="SOLO";render()}
function copyCode(){try{navigator.clipboard.writeText(CODE).then(function(){$("lm").textContent="Code copied! 📋"})}catch(e){$("lm").textContent="Code: "+CODE}}
async function leave(){music(0);if(G&&G.tm)clearInterval(G.tm);G=null;try{speechSynthesis.cancel()}catch(e){}if(NR){try{await NR.leave()}catch(e){}NR=null}$("cd").hidden=true;show("home")}
// ---- lobby
function hostOf(L){return L[0]}
function renderLobby(L,full){var h=hostOf(L),isH=h&&h.isMe&&h.sameTab,hc=(h&&h.presence.cfg)||cfg;if(isH)hc=cfg;
 $("pc").textContent=Math.min(L.length,5);
 var s="";for(var i=0;i<5;i++){var p=L[i];s+=p?"<div class='pl' style='--c:"+COLS[i]+"'><span class='e'>"+esc(p.presence.av||"🙂")+"</span><b>"+esc(p.presence.n)+"</b>"+(i==0?"<span class='tag'>👑 HOST</span>":"")+(p.isMe&&p.sameTab?" <span class='tag'>YOU</span>":"")+"</div>":"<div class='pl empty'><span class='e'>❔</span><b>Waiting…</b></div>"}
 $("slots").innerHTML=s;
 $("mins").innerHTML=[1,2,3,4,5].map(function(m){return"<button class='"+(hc.min==m?"on":"alt")+"' "+(isH||solo?"onclick='setCfg("+m+")'":"disabled")+">"+m+" min</button>"}).join("");
 $("lvls").innerHTML=[["easy","🌱 Easy"],["med","🔥 Medium"],["hard","💀 Hard"],["mix","🌈 Mixed"]].map(function(l){return"<button class='"+(hc.lvl==l[0]?"on":"alt")+"' "+(isH||solo?"onclick='setCfg(0,\""+l[0]+"\")'":"disabled")+">"+l[1]+"</button>"}).join("");
 $("startb").hidden=!(isH||solo);if(!(isH||solo))$("lm").textContent="⏳ Waiting for the host to start…";else if(!solo&&L.length<2)$("lm").textContent="Share the code! You can start alone or wait for friends.";else if(!solo)$("lm").textContent="Everyone ready? Tap START!"}
function setCfg(m,l){if(m)cfg.min=m;if(l)cfg.lvl=l;setP({cfg:{min:cfg.min,lvl:cfg.lvl}});render()}
function hostStart(){var g={id:Math.random().toString(36).slice(2,9),p:"play",min:cfg.min,lvl:cfg.lvl,seed:Math.floor(Math.random()*1e9),t0:Date.now()+OFF};if(solo){startGame(g)}else{setP({g:g,cfg:cfg});startGame(g)}}
// ---- render driver
function render(){var L=plist(),i=mineIdx(L);if(NR&&i<0)return;
 if(NR&&i>=5&&view=="lobby"){$("hm").textContent="😅 That room is full (5 players max).";leave();return}
 L=L.slice(0,5);var h=hostOf(L),g=h&&h.presence.g;
 if(NR&&h&&!(h.isMe&&h.sameTab)&&g&&g.p=="play"&&g.id!==lastGid&&Math.abs(Date.now()+OFF-g.t0)<9000&&view!="game")startGame(g);
 if(NR&&h&&!(h.isMe&&h.sameTab)&&g&&g.p=="lobby"&&view=="res"&&G&&G.done&&L.every(function(p){return p.presence.d}))$("rm").textContent="Host is back in the lobby. Tap Play again!";
 if(view=="lobby")renderLobby(L);if(view=="game")renderTrack(L);if(view=="res")renderRes(L)}
// ---- game
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function startGame(g){lastGid=g.id;var f={easy:function(w){return w.length<=5},med:function(w){return w.length>5&&w.length<=8},hard:function(w){return w.length>=9},mix:function(){return true}}[g.lvl]||function(){return true};
 var pool=ALL.filter(f),r=rng(g.seed),a=pool.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}
 if(G&&G.tm)clearInterval(G.tm);
 G={w:a,i:0,sc:0,ls:0,st:0,bs:0,dur:g.min*60,end:0,typed:"",lock:true,done:false,tm:0};
 setP({sc:0,ls:0,st:0,bs:0,d:0});show("game");$("rm").textContent="";$("gs").textContent="0";$("gst").textContent="0🔥";$("hint").textContent="";$("ring").classList.remove("low");$("fg").style.strokeDashoffset=0;$("tm").textContent=fmt(G.dur);
 renderTrack(plist().slice(0,5));var n=3;var cd=$("cd");cd.hidden=false;
 (function tick(){if(!G)return;if(n>0){$("cdn").textContent=n;$("cdn").style.animation="none";void $("cdn").offsetWidth;$("cdn").style.animation="";sfx("cnt");n--;setTimeout(tick,900)}else{$("cdn").textContent="GO!";$("cdn").style.animation="none";void $("cdn").offsetWidth;$("cdn").style.animation="";sfx("go");setTimeout(function(){cd.hidden=true},700);G.end=Date.now()+G.dur*1000;G.lock=false;nextW();music(1);G.tm=setInterval(clock,200)}})()}
function fmt(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+":"+("0"+s%60).slice(-2)}
function clock(){var left=(G.end-Date.now())/1000;$("tm").textContent=fmt(left);$("fg").style.strokeDashoffset=276.5*(1-Math.max(0,left)/G.dur);var low=left<=10;$("ring").classList.toggle("low",low);if(low&&Math.ceil(left)!=G.lt){G.lt=Math.ceil(left);sfx("tick")}if(left<=0)finish()}
function curW(){return G.w[G.i%G.w.length]}
function nextW(){G.typed="";G.lock=false;$("stage").className="card stage";$("hint").textContent="";drawSlots();sayW(1)}
function drawSlots(){var w=curW(),h="";for(var i=0;i<w.length;i++)h+="<span class='sl"+(G.typed[i]?" f":"")+"'>"+(G.typed[i]||"")+"</span>";$("gslots").innerHTML=h}
function sayW(r){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(curW());u.lang="en-US";u.rate=r;speechSynthesis.speak(u)}catch(e){}}
async function doHint(){var w=curW();if(w in hintCache){$("hint").textContent=hintCache[w];return}$("hint").textContent="Looking up…";try{var r=await fetch(API+w),d=(await r.json())[0];hintCache[w]="💡 ("+d.meanings[0].partOfSpeech+") "+d.meanings[0].definitions[0].definition}catch(e){hintCache[w]="💡 Starts with “"+w[0].toUpperCase()+"”, "+w.length+" letters."}if(G&&curW()==w)$("hint").textContent=hintCache[w]}
function typeK(c){if(!G||G.lock||G.done)return;if(G.typed.length<curW().length){G.typed+=c;drawSlots();pop(G.typed.length)}}
function backK(){if(!G||G.lock)return;G.typed=G.typed.slice(0,-1);drawSlots()}
function submitW(){if(!G||G.lock||G.done||!G.typed)return;var w=curW(),ok=G.typed==w;G.lock=true;var st=$("stage");
 if(ok){G.sc++;G.ls+=w.length;G.st++;G.bs=Math.max(G.bs,G.st);st.className="card stage ok";sfx("ok");var r=$("gslots").getBoundingClientRect();burst(r.left+r.width/2,r.top,40);if(G.st>=3)combo("🔥 x"+G.st+" COMBO!");else combo("+1");setP({sc:G.sc,ls:G.ls,st:G.st,bs:G.bs});setTimeout(function(){if(!G||G.done)return;G.i++;nextW()},650)}
 else{G.st=0;st.className="card stage bad";sfx("bad");$("gslots").innerHTML=w.split("").map(function(c){return"<span class='sl'>"+c+"</span>"}).join("");$("hint").textContent="❌ It’s spelled “"+w+"”";setP({st:0});setTimeout(function(){if(!G||G.done)return;G.i++;nextW()},1300)}
 $("gs").textContent=G.sc;$("gst").textContent=G.st+"🔥"}
function skipW(){if(!G||G.lock||G.done)return;G.st=0;$("gst").textContent="0🔥";setP({st:0});G.i++;nextW()}
function combo(t){var d=document.createElement("div");d.className="combo";d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},1000)}
document.addEventListener("keydown",function(e){if(view!="game"||e.ctrlKey||e.metaKey||e.altKey)return;if(e.key=="Enter"){e.preventDefault();submitW()}else if(e.key=="Backspace")backK();else if(/^[a-zA-Z]$/.test(e.key))typeK(e.key.toLowerCase())});
$("kb").innerHTML=["qwertyuiop","asdfghjkl","zxcvbnm"].map(function(r,i){return"<div class='kr'>"+r.split("").map(function(c){return"<button class='kk' onclick='typeK(\""+c+"\")'>"+c+"</button>"}).join("")+(i==2?"<button class='kk w' onclick='backK()'>⌫</button>":"")+"</div>"}).join("");
function renderTrack(L){if(!L.length)return;var mx=Math.max.apply(null,L.map(function(p){return p.presence.sc||0})),T=Math.max(8,mx+4);
 $("track").innerHTML=L.map(function(p,i){var s=p.presence.sc||0,l=Math.min(86,3+s/T*83);return"<div class='lane' style='--c:"+COLS[i]+"'><span class='nm'>"+esc(p.presence.n)+(p.isMe&&p.sameTab?" (you)":"")+"</span><span class='rc' style='left:"+l+"%'>"+esc(p.presence.av||"🙂")+"</span><span class='sc'>"+s+"</span></div>"}).join("")+"<div class='flag'></div>"}
function finish(){if(G.done)return;G.done=true;G.lock=true;music(0);clearInterval(G.tm);try{speechSynthesis.cancel()}catch(e){}setP({sc:G.sc,ls:G.ls,bs:G.bs,d:1});sfx("win");show("res");G.shown=false;render()}
// ---- results
function renderRes(L){var R=L.map(function(p,i){return{p:p,i:i,sc:p.presence.sc||0,ls:p.presence.ls||0,bs:p.presence.bs||0,d:p.presence.d}}).sort(function(a,b){return b.sc-a.sc||b.ls-a.ls}),all=R.every(function(r){return r.d}),top=R[0];
 if(!all){$("winner").textContent="⏳ Waiting for the others to finish…"}else{var tie=R.length>1&&R[1].sc==top.sc&&R[1].ls==top.ls;$("winner").innerHTML=tie?"🤝 It’s a tie!":"🏆 "+esc(top.p.presence.n)+" wins!";if(!G.shown){G.shown=true;rain();beep(1200,.3,"triangle",.1)}}
 var order=R.length>=3?[R[1],R[0],R[2]]:R.length==2?[R[1],R[0]]:[R[0]],mxs=Math.max(1,top.sc),h="";
 order.forEach(function(r){var rank=R.indexOf(r),ht=Math.max(40,Math.round(r.sc/mxs*170));h+="<div class='pod'><span class='e"+(rank==0&&all?" w":"")+"'>"+(rank==0&&all?"👑":"")+esc(r.p.presence.av||"🙂")+"</span><b>"+esc(r.p.presence.n)+"</b><div class='bar' style='--c:"+COLS[r.i]+";--h:"+ht+"px'>"+["🥇","🥈","🥉"][rank]+" "+r.sc+"</div></div>"});
 $("podium").innerHTML=h;
 $("ranks").innerHTML=R.map(function(r,k){return"<div class='rk' style='border-color:"+COLS[r.i]+"'><span>#"+(k+1)+"</span><span class='e'>"+esc(r.p.presence.av||"🙂")+"</span><b>"+esc(r.p.presence.n)+(r.p.isMe&&r.p.sameTab?" (you)":"")+"</b><span>"+r.sc+" words • "+r.ls+" letters • best streak "+r.bs+(r.d?"":" ⏳")+"</span></div>"}).join("")}
function again(){if(G&&G.tm)clearInterval(G.tm);G=null;var L=plist(),h=L[0];if(h&&h.isMe&&h.sameTab&&NR)setP({g:{p:"lobby"}});setP({sc:0,ls:0,st:0,bs:0,d:0});show("lobby");render()}
